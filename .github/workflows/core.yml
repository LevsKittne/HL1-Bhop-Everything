name: Reference and portable cores
on: [push, pull_request, workflow_dispatch]
jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: '8.0.x'
      - run: python tools/check.py
      - run: mkdir -p .build
      - run: c++ -std=c++17 -O2 tests/test_core.cpp -o .build/test_core
      - run: .build/test_core tests/cases.csv
      - run: dotnet run --project tests/csharp/CoreChecks.csproj -- tests/cases.csv
  godot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - run: mkdir -p .build/godot
      - name: Download official Godot 4.7.2
        run: curl --fail --location --retry 2 https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip --output .build/godot/godot.zip
      - name: Verify official release digest
        run: echo 'cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4  .build/godot/godot.zip' | sha256sum --check
      - run: unzip -q .build/godot/godot.zip -d .build/godot
      - run: chmod +x .build/godot/Godot_v4.7.2-stable_linux.x86_64
      - run: timeout 120s .build/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path examples/godot --editor --import
      - run: timeout 60s .build/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path examples/godot --script res://test_math.gd
      - run: timeout 60s .build/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --fixed-fps 60 --path examples/godot --script res://test_runtime.gd
